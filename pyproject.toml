[project]
name = "ai-ops-de25"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4,<2",
    "fastapi>=0.162.0",
    "iprogress>=0.4",
    "ipykernel>=7.4.0",
    "lancedb>=0.41.0",
    "logfire[system-metrics,variables]>=5.3.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pydantic-ai>=2.61.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["model"]
